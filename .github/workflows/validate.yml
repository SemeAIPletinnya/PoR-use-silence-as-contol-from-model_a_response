name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check markdown
        run: |
          echo "Checking markdown files..."
          find . -name "*.md" -type f | head -20
          echo "✓ Structure valid"
